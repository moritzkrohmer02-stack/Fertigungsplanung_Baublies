<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fertigungsplanung Rollen &amp; Strehler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Werkstatt-Leitstand. Schmale Navigationsleiste links, Arbeitsfläche rechts; Tabellen und Raster statt Karten. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --panel-2:#eef0ee; --line:#d9ddd9; --line-2:#c4cac5;
  --ink:#1b2226; --ink-2:#4a555b; --ink-3:#7a858a;
  --accent:#2d5a9b; --accent-ink:#ffffff; --accent-soft:#e3ebf6;
  --straw:#c8962e; --straw-soft:#f6ecd4;
  --ok:#2f7d4f; --ok-soft:#dcefe3; --warn:#b4720b; --warn-soft:#fbecd0; --bad:#b8352b; --bad-soft:#f7dedb; --idle:#9aa3a7; --idle-soft:#e7eaea;
  --kw-a:#ffffff; --kw-b:#f1f4f8;
  --shadow:0 8px 30px rgba(20,30,40,.14);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14191c; --panel:#1b2226; --panel-2:#222a2f; --line:#2e383d; --line-2:#3d484e;
  --ink:#e6eaeb; --ink-2:#b0babe; --ink-3:#7f8b90;
  --accent:#7aa5e6; --accent-ink:#0e1a2c; --accent-soft:#1f3047;
  --straw:#e0b45a; --straw-soft:#3a3020;
  --ok:#5cc187; --ok-soft:#1c3427; --warn:#e2a443; --warn-soft:#3b2e17; --bad:#ef7a6f; --bad-soft:#41221f; --idle:#6f7a7f; --idle-soft:#262e32;
  --kw-a:#1b2226; --kw-b:#20292e; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14191c; --panel:#1b2226; --panel-2:#222a2f; --line:#2e383d; --line-2:#3d484e;
  --ink:#e6eaeb; --ink-2:#b0babe; --ink-3:#7f8b90;
  --accent:#7aa5e6; --accent-ink:#0e1a2c; --accent-soft:#1f3047;
  --straw:#e0b45a; --straw-soft:#3a3020;
  --ok:#5cc187; --ok-soft:#1c3427; --warn:#e2a443; --warn-soft:#3b2e17; --bad:#ef7a6f; --bad-soft:#41221f; --idle:#6f7a7f; --idle-soft:#262e32;
  --kw-a:#1b2226; --kw-b:#20292e; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em;line-height:1.2;padding:0 8px}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:0;margin-top:3px}
.temper{height:4px;border-radius:2px;margin:10px 8px 0;background:linear-gradient(90deg,#e9d8a6,#c8962e,#8a5a2b,#6b3f6e,#2d5a9b,#5b8fc8)}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-weight:600}
nav.tabs a:hover{background:var(--panel-2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.conn{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
main{min-width:0;padding-block:20px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar > div:first-child{flex:1 1 360px;min-width:0}
.topbar .grow{display:none}
a.kpi{color:inherit;text-decoration:none}
.topbar h1{font-family:var(--f-display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .sub{color:var(--ink-3);font-size:14px}
.grow{flex:1}
.gsearch{position:relative}
.gsearch input{width:280px;max-width:100%}
.banner{background:var(--straw-soft);border:1px solid var(--straw);color:var(--ink);padding:8px 12px;border-radius:var(--r);margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* controls */
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 9px;min-height:36px;max-width:100%}
textarea{min-height:70px;width:100%;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r);padding:7px 13px;min-height:36px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:30px;padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;font-weight:600;cursor:pointer;min-height:34px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
label.f > input,label.f > select,label.f > textarea{font-weight:400;color:var(--ink);width:100%}
.hint{font-size:12.5px;color:var(--ink-3);font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar label.f{min-width:140px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:.005em;text-wrap:balance}
.panel h2 .hint{font-family:var(--f-body);margin-left:6px}
.grid{display:grid;gap:14px}
.grid > *,.kpis > *{min-width:0}
.seg{flex-wrap:wrap;max-width:100%}
.seg button{white-space:normal;text-align:center}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--line-2)}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:13px;color:var(--ink-2)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.t th.sort{cursor:pointer;user-select:none}
.t th.sort:hover{color:var(--ink)}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--accent-soft)}
.t tr.kwb td{background:var(--kw-b)}
.t td.num,.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.t td.nowrap{white-space:nowrap}
.t select.inl{min-height:30px;padding:3px 6px;font-size:13px;max-width:210px}
.mono{font-family:var(--f-mono);font-size:13px}
.clip{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-3)}
.tablefoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--idle-soft);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.straw{background:var(--straw-soft);color:var(--straw)}
.stripe{width:4px;height:22px;border-radius:2px;display:inline-block;background:var(--idle)}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.ok{background:var(--ok)}

/* ampel */
.ampel td.cell{padding:4px}
.amp{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;min-width:70px;height:46px;font-variant-numeric:tabular-nums;cursor:pointer;border:1px solid transparent}
.amp b{font-size:15px}
.amp span{font-size:11.5px;opacity:.85}
.amp.ok{background:var(--ok-soft);color:var(--ok)} .amp.warn{background:var(--warn-soft);color:var(--warn)} .amp.bad{background:var(--bad-soft);color:var(--bad)} .amp.idle{background:var(--idle-soft);color:var(--ink-3)}
.amp.none{background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--panel) 6px 12px);color:var(--ink-3)}
.amp:hover{border-color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* bars */
.sbar{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--panel-2)}
.sbar > div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.blist{display:flex;flex-direction:column;gap:6px}
.bl{display:grid;grid-template-columns:minmax(0,220px) 1fr 70px 70px;gap:10px;align-items:center;font-size:13.5px}
.bl .tr{height:12px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.bl .tr div{height:100%;background:var(--accent);border-radius:3px}
.bl .n{text-align:right;font-variant-numeric:tabular-nums}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-size:13px}

/* week plan */
.wk{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.wkwrap{overflow-x:auto}
.wk .hd{background:var(--panel-2);padding:8px 10px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.wk .hd.today{color:var(--accent)}
.wk .mc{padding:10px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.wk .mc small{font-weight:400;color:var(--ink-3)}
.wk .dc{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px;min-height:92px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.wk .dc:hover{background:var(--panel-2)}
.wk .dc.drop{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-3px}
.wk .dc.off{background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--panel) 6px 12px)}
.cap{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cap .tr{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.cap .tr div{height:100%}
.cap.ok .tr div{background:var(--ok)} .cap.warn .tr div{background:var(--warn)} .cap.bad .tr div{background:var(--bad)} .cap.bad{color:var(--bad);font-weight:700}
.note{font-size:11.5px;background:var(--straw-soft);color:var(--ink);border-radius:3px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:4px;padding:3px 6px;background:var(--panel);cursor:grab;display:flex;flex-direction:column;min-width:0}
.chip:hover{border-color:var(--ink-3);border-left-color:var(--accent)}
.chip .a{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .b{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.pers{border-left-color:var(--straw)}
.chip.late{border-left-color:var(--bad)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(15,20,25,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--panel);z-index:41;box-shadow:var(--shadow);border-radius:8px;display:flex;flex-direction:column}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--f-display);font-size:18px;margin:0;font-weight:700;flex:1;min-width:0;text-wrap:balance}
.db{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .span2{grid-column:1/-1}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;background:var(--panel-2);border-radius:var(--r);padding:12px}
.facts div{display:flex;flex-direction:column;min-width:0}
.facts dt{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sect{font-family:var(--f-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:4px 0 -4px}
.mpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mpick button{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r);padding:7px;text-align:left;cursor:pointer;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);outline:1px solid var(--accent)}
.mpick small{font-size:11.5px}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ac{position:relative}
.aclist{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);z-index:50;max-height:260px;overflow:auto}
.aclist button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;cursor:pointer;font-size:13.5px}
.aclist button:hover,.aclist button.sel{background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);z-index:60;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:14px}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:3px 8px;cursor:pointer;font-weight:600}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.steps td input[type=number]{width:70px}
svg.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
svg.chart .grid{stroke:var(--line)}

@media (max-width: 1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .g3{grid-template-columns:1fr 1fr} }
@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 12px;z-index:20;border-right:0;border-bottom:1px solid var(--line);gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .brand small,.temper,.side-foot{display:none}
  nav.tabs{flex-direction:row;overflow-x:auto;flex:1}
  nav.tabs a{padding:7px 9px;white-space:nowrap}
  nav.tabs a span{display:none}
  nav.tabs a[aria-current="page"] span{display:inline}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2,.g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fg{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mpick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bl{grid-template-columns:minmax(0,1fr) 80px 46px 56px}
  .gsearch input{width:100%}
  .gsearch{width:100%}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="app">
  <aside class="side">
    <div class="brand">Fertigungsplanung<small>Rollen &amp; Strehler · Arbeitsvorbereitung</small><div class="temper" aria-hidden="true"></div></div>
    <nav class="tabs" id="nav" aria-label="Bereiche"></nav>
    <div class="side-foot">
      <span class="conn"><i class="dot" id="connDot"></i><span id="connTxt">Verbinde …</span></span>
      <span id="footUser"></span>
    </div>
  </aside>
  <main id="main">
    <div id="banner"></div>

/* Verteilung eines Auftrags auf freie Kapazität ab Startdatum */
function verteilen(mid, start, laufzeit, ruest, stueck, opts = {}) {

  if (opts.einTag || total <= 0) { let s0 = start; while (kapa(mid, s0).verf <= 0 && s0 < start + 30) s0++; if (s0 >= start + 30) s0 = start; days.push({ n: s0, h: total }); if (s0 !== start) days.warn = 'Starttag ohne Kapazität – auf ' + D.fmt(s0) + ' verschoben.'; }
  else {
    let n = start;
    for (let i = 0; i < 180 && rem > 1e-6; i++, n++) {
      const c = kapa(mid, n, opts.skip);

}

const OCOLS = [
  ['kw', 'KW', 1], ['ltBest', 'Best. Liefertermin', 1], ['ltIst', 'Aktueller Termin', 1], ['artikel', 'Artikel', 1], ['bez', 'Bezeichnung', 1], ['kunde', 'Kunde', 1], ['ka', 'Kundenauftrag', 0], ['fa', 'FA', 1], ['stueck', 'Stück', 1], ['stand', 'Produktionsstand', 1], ['eingeplant', 'Eingeplant', 1], ['perf', 'Termin', 1], ['bemerkung', 'Bemerkung', 1],
  ['typ', 'Typ', 0], ['groesse', 'Größe', 0], ['besch', 'Beschichtung', 0], ['stg', 'Steigung', 0], ['kr', 'Kopierrolle', 0], ['halb', 'Halbfabrikat', 0], ['f34', '3/4-Fabrikat', 0], ['f14', '1/4-Fabrikat', 0], ['nut', 'Nut schleifen', 0], ['nutG', 'Nut geschliffen', 0], ['lieferWochen', 'Lieferzeit (Wo.)', 0], ['gedruckt', 'Gedruckt', 0], ['geplant', 'Geplant (h)', 0], ['sonstige', 'Sonstige Bemerkung', 0]

function visibleCols() { if (!S.ui.orders.cols) { try { const c = JSON.parse(localStorage.getItem('fp-cols') || 'null'); if (Array.isArray(c)) S.ui.orders.cols = c; } catch (e) { } } return S.ui.orders.cols || OCOLS.filter(c => c[2]).map(c => c[0]); }
function filteredOrders() {
  const u = S.ui.orders; const q = norm(u.q); const today = D.today(); const soon = addWorkdays(today, 10);
  let rows = openOrders(u.bereich === 'alle' ? null : u.bereich).map(o => ({ o, x: enrich(o) }));
  if (q) rows = rows.filter(r => [r.o.fa, r.o.artikel, r.o.ka, r.o.kunde, r.x.bez, r.o.bemerkung, r.o.stand, r.x.kr, r.x.halb].some(v => norm(v).includes(q)));
  if (u.stand) rows = rows.filter(r => r.o.stand === u.stand);
  if (u.eing) rows = rows.filter(r => u.eing === 'eingeplant' ? !['noch nicht eingeplant', 'profiliert', 'Rändelrolle'].includes(eingeplantNorm(r.o.eingeplant)) : eingeplantNorm(r.o.eingeplant) === u.eing);
  if (u.perf === 'ueber') rows = rows.filter(r => r.x.ueberfaellig);
  else if (u.perf === 'todo') rows = rows.filter(r => r.x.ueberfaellig || (eingeplantNorm(r.o.eingeplant) === 'noch nicht eingeplant' && (D.parse(r.o.ltIst || r.o.ltBest) ?? 9e9) <= soon));
  else if (u.perf) rows = rows.filter(r => r.x.perf === u.perf);
  const key = u.sort, dir = u.dir;
  const val = r => { switch (key) { case 'kw': case 'ltBest': return D.parse(r.o.ltBest) ?? 9e9; case 'ltIst': return D.parse(r.o.ltIst || r.o.ltBest) ?? 9e9; case 'stueck': return numOr(r.o.stueck, 0); case 'bez': return norm(r.x.bez); case 'perf': return r.x.diff ?? 0; case 'pos': return r.o.pos || 0; default: return norm(r.o[key] ?? r.x[key]); } };
  rows.sort((a, b) => { const va = val(a), vb = val(b); if (typeof va === 'string' && typeof vb === 'string') { const c = COLL.compare(va, vb); if (c) return c * dir; return (a.o.pos || 0) - (b.o.pos || 0); } if (va < vb) return -dir; if (va > vb) return dir; return (a.o.pos || 0) - (b.o.pos || 0); });
  return rows;
}

function kennRows() {

}
function monthChart() {
  const all = gelAll(); const t = new Date(D.today() * 864e5); const months = [];
  for (let i = 23; i >= 0; i--) { const d = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() - i, 1)); months.push({ y: d.getUTCFullYear(), m: d.getUTCMonth(), ok: 0, n: 0 }); }
  const idx = new Map(months.map((m, i) => [m.y * 12 + m.m, i]));
  for (const r of all) { const n = D.parse(r.ltIst || r.ltBest); if (n === null) continue; const d = new Date(n * 864e5); const i = idx.get(d.getUTCFullYear() * 12 + d.getUTCMonth()); if (i === undefined || !r.perf) continue; months[i].n++; if (r.perf !== 'Verspätet') months[i].ok++; }
  const W = 760, H = 220, L = 40, R = 10, T = 12, B = 34; const iw = W - L - R, ih = H - T - B; const bw = iw / months.length;
  let s = '<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="min-width:560px" role="img" aria-label="Liefertreue je Monat">';
  [0, .25, .5, .75, 1].forEach(v => { const y = T + ih * (1 - v); s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + (v * 100) + ' %</text>'; });
  let path = '', dots = '';
  months.forEach((m, i) => {
    const x = L + bw * i + bw / 2;
    if (m.n) { const v = m.ok / m.n; const y = T + ih * (1 - v); path += (path ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (i === months.length - 1 ? 4.5 : 3) + '" fill="var(--accent)"><title>' + (m.m + 1) + '/' + m.y + ': ' + fmtPct(v) + ' (' + m.n + ' FA)</title></circle>'; }
    if (i % 2 === 0) s += '<text x="' + x + '" y="' + (H - 12) + '" text-anchor="middle">' + String(m.m + 1).padStart(2, '0') + '/' + String(m.y).slice(2) + '</text>';
  });
  s += '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2"/>' + dots + '</svg></div>';
  return s;
}

/* ===================== Overlay-Grundlagen ===================== */
let overlayStack = [];
function openOverlay(kind, html, onClose) {
  const host = $('#overlay');
  const wrap = document.createElement('div');
  wrap.innerHTML = '<div class="scrim"></div><div class="' + kind + '" role="dialog" aria-modal="true">' + html + '</div>';
  host.appendChild(wrap);
  const close = (force) => { if (!force && wrap._dirty && !wrap._confirmLeave) { wrap._confirmLeave = true; const f = $('.df', wrap); if (f && !$('#leaveWarn', wrap)) { f.insertAdjacentHTML('afterbegin', '<div class="confirm" id="leaveWarn" style="width:100%">Ungespeicherte Änderungen verwerfen? <button class="btn small danger" type="button" id="leaveYes">Verwerfen</button><button class="btn small" type="button" id="leaveNo">Weiter bearbeiten</button></div>'); $('#leaveYes', wrap).onclick = () => close(true); $('#leaveNo', wrap).onclick = () => { wrap._confirmLeave = false; $('#leaveWarn', wrap).remove(); }; } return; } wrap.remove(); overlayStack = overlayStack.filter(o => o !== api); onClose && onClose(); };
  const api = { el: wrap, close, dirty() { wrap._dirty = true; } };
  $('.scrim', wrap).onclick = () => close();
  $$('[data-close]', wrap).forEach(b => b.onclick = () => close());
  overlayStack.push(api);
  setTimeout(() => { const f = $('input:not([type=hidden]):not([disabled]),select,textarea', $('.' + kind, wrap)); if (f && kind === 'modal') f.focus(); }, 30);
  return api;
}
/* Negative Zahlen ablehnen: alter Wert bleibt, Hinweis erscheint */
document.addEventListener('focusin', e => { const t = e.target; if (t && t.matches && t.matches('input[type=number]')) t.dataset.prev = t.value; }, true);
document.addEventListener('change', e => { const t = e.target; if (t && t.matches && t.matches('input[type=number][min="0"]') && t.value !== '' && Number(t.value) < 0) { e.stopImmediatePropagation(); t.value = t.dataset.prev ?? ''; t.dispatchEvent(new Event('input', { bubbles: true })); toast('Negative Werte sind nicht erlaubt – der bisherige Wert bleibt erhalten.'); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlayStack.length && !e.defaultPrevented) { const t = e.target; if (t && t.closest && t.closest('.ac') && !$('.aclist', t.closest('.ac')).hidden) return; overlayStack[overlayStack.length - 1].close(); } });

/* ===================== Einplanen ===================== */
function laufzeitVorschlag(artikel, stueck) {
  // Stunden je Stück aus bisherigen Einplanungen dieses Artikels (Excel-Stammdaten-Laufzeiten sind uneinheitlich)
  if (!artikel) return null; let h = 0, s = 0;
  for (const e of S.entries) if (String(e.artikel) === String(artikel) && numOr(e.stueck, 0) > 0) { h += numOr(e.laufzeit, 0); s += numOr(e.stueck, 0); }
  if (!s || !h) return null; return Math.round(h / s * numOr(stueck, 0) * 2) / 2;
}

async function restoreBackup(file, confirmed) {
  const msg = $('#dimpmsg');
  let data; try { data = JSON.parse(await file.text()); } catch (e) { msg.innerHTML = '<span style="color:var(--bad)">Die Datei ist keine gültige Sicherung (kein JSON). Nichts wurde geändert.</span>'; toast('Ungültige Sicherungsdatei – nichts geändert.'); return; }
  const cols = ['auftraege', 'plan', 'kapazitaet', 'geliefert', 'bestand', 'artikel'];
  if (!data || typeof data !== 'object' || !cols.some(c => data[c] && typeof data[c] === 'object')) { msg.innerHTML = '<span style="color:var(--bad)">In der Datei wurden keine Daten dieses Tools gefunden. Nichts wurde geändert.</span>'; toast('Keine Tool-Daten in der Datei – nichts geändert.'); return; }
  let n = 0, total = cols.reduce((s, c) => s + Object.keys(data[c] || {}).length, 0) + (data.einstellungen ? 1 : 0);
  if (!confirmed) { msg.innerHTML = '<div class="confirm">Sicherung vom ' + esc(data.exportiert ? new Date(data.exportiert).toLocaleString('de-DE') : 'unbekannten Datum') + ' mit ' + total + ' Einträgen einspielen? Gleichnamige Einträge werden überschrieben. <button class="btn small danger" type="button" id="rsok">Einspielen</button><button class="btn small" type="button" id="rsno">Abbrechen</button></div>'; $('#rsok').onclick = () => restoreBackup(file, true); $('#rsno').onclick = () => { msg.textContent = 'Abgebrochen – nichts geändert.'; }; return; }
  msg.textContent = 'Wiederherstellen …';
  const ok = await write(async () => {
    for (const c of cols) for (const [id, doc] of Object.entries(data[c] || {})) { if (!doc || typeof doc !== 'object') continue; await Store.set(c, id, doc); n++; if (n % 25 === 0) msg.textContent = 'Wiederherstellen … ' + n + ' / ' + total; }
    if (data.einstellungen) { const cfg = Object.assign({}, data.einstellungen); await Store.set('einstellungen', 'config', cfg); n++; }
  });
  msg.textContent = ok ? n + ' Einträge wiederhergestellt.' : 'Wiederherstellen abgebrochen nach ' + n + ' Einträgen.'; toast(ok ? 'Sicherung eingespielt: ' + n + ' Einträge' : 'Wiederherstellen unvollständig');
}

/* Tag einer Maschine: Kapazität, Ausfall, Einträge */
function openDay(mid, ds) {
  const n = D.parse(ds); const m = machine(mid); const c = kapa(mid, n);
  const ov = openOverlay('modal', '<div class="dh"><h3>' + esc(m.name) + ' · ' + D.dayName(n) + ', ' + D.fmt(n) + '</h3><button class="btn ghost" type="button" data-close aria-label="Schließen">✕</button></div><div class="db">' +
    '<div class="sect">Kapazität</div><div class="fg"><label class="f">Grundkapazität (h)<input type="number" min="0" step="0.5" id="kg" value="' + c.grund + '"><span class="hint">Standard: ' + fmtNum(D.wd(n) <= 5 ? m.std : 0) + ' h</span></label><label class="f">Ausfall (h)<input type="number" min="0" step="0.5" id="ka" value="' + c.ausfall + '"><span class="hint">Urlaub, Krankheit, Wartung, Kurzarbeit</span></label>' +
    '<label class="f span2">Bemerkung<input type="text" id="kb" value="' + esc(c.bem) + '" placeholder="z. B. Urlaub Moni, Gleitzeit Luis, Maschinenwartung"></label></div>' +
    '<div class="facts"><div><dt>Verfügbar</dt><dd>' + fmtNum(c.verf) + ' h</dd></div><div><dt>Geplant</dt><dd>' + fmtNum(c.geplant) + ' h</dd></div><div><dt>Rest</dt><dd style="color:var(--' + (c.rest < 0 ? 'bad' : 'ok') + ')">' + fmtNum(c.rest) + ' h</dd></div></div>' +
    '<div class="sect">Einträge</div>' + (c.list.length ? '<div class="tw"><table class="t"><tbody>' + c.list.map(e => '<tr class="click" data-e="' + esc(e.id) + '"><td>' + esc(e.artikel || e.bemerkung) + '<div class="hint">' + esc([e.kunde, e.fa ? 'FA ' + e.fa : '', e.stueck ? fmtNum(numOr(e.stueck, 0), 0) + ' Stk' : ''].filter(Boolean).join(' · ')) + '</div></td><td class="num">' + fmtNum(numOr(e.laufzeit, 0) + numOr(e.ruestzeit, 0)) + ' h</td></tr>').join('') + '</tbody></table></div>' : '<div class="hint">Keine Einträge an diesem Tag.</div>') +
    '</div><div class="df"><button class="btn primary" type="button" id="kok">Kapazität speichern</button><button class="btn" type="button" id="kadd">+ Eintrag an diesem Tag</button><button class="btn ghost" type="button" id="kstd">Auf Standard zurücksetzen</button></div>');
  const el = ov.el;
  $$('input', el).forEach(i => i.addEventListener('input', () => ov.dirty()));
  $('#kok', el).onclick = async () => {
    const g = pos($('#kg', el).value, 0), a = Math.min(g, pos($('#ka', el).value, 0)), b = $('#kb', el).value.trim();
    const std = D.wd(n) <= 5 ? stdAm(m, ds) : 0;

    if (await write(() => setKap(ds, mid, vals), 'Kapazität gespeichert')) ov.close(true);
  };
  $('#kstd', el).onclick = async () => { if (await write(() => setKap(ds, mid, { grund: null, ausfall: null, bemerkung: null }), 'Auf Standard zurückgesetzt')) ov.close(true); };
  $('#kadd', el).onclick = () => { ov.close(true); openPlanDialog({ maschine: mid, datum: ds }); };
  $$('[data-e]', el).forEach(tr => tr.onclick = () => { ov.close(true); openEntry(tr.dataset.e); });
}

/* Ausfall / Urlaub über mehrere Tage und Maschinen */
function openAbsence() {
  const t = D.str(D.today());
  const ov = openOverlay('modal', '<div class="dh"><h3>Ausfall / Urlaub eintragen</h3><button class="btn ghost" type="button" data-close aria-label="Schließen">✕</button></div><div class="db"><div class="sect">Maschinen</div><div class="row">' + S.cfg.maschinen.map(m => '<label class="chk"><input type="checkbox" data-am="' + m.id + '"> ' + esc(m.name) + '</label>').join('') + '</div>' +
    '<div class="fg"><label class="f">Von<input type="date" id="av" value="' + t + '"></label><label class="f">Bis<input type="date" id="ab" value="' + t + '"></label>' +
    '<label class="f">Ausfall je Tag<select id="aart"><option value="voll">Ganzer Tag (gesamte Grundkapazität)</option><option value="schicht">Eine Schicht (halbe Grundkapazität)</option><option value="h">Stunden angeben</option><option value="0">Kein Ausfall (nur Bemerkung)</option></select></label><label class="f">Stunden je Tag<input type="number" min="0" step="0.5" id="ah" value="7.5" disabled></label>' +
    '<label class="f span2">Bemerkung<input type="text" id="abem" placeholder="z. B. Urlaub Moni & Savas, Kurzarbeit, Maschinenwartung"></label></div><p class="hint">Gilt nur für Arbeitstage (Mo–Fr ohne Feiertage).</p></div><div class="df"><button class="btn primary" type="button" id="aok">Eintragen</button><button class="btn" type="button" data-close>Abbrechen</button><span class="hint" id="amsg"></span></div>');
  const el = ov.el;
  $('#aart', el).onchange = e => { $('#ah', el).disabled = e.target.value !== 'h'; };
  $('#aok', el).onclick = async () => {
    const ms = $$('[data-am]', el).filter(c => c.checked).map(c => c.dataset.am); const v = D.parse($('#av', el).value), b = D.parse($('#ab', el).value);
    if (!ms.length) { $('#amsg', el).textContent = 'Bitte mindestens eine Maschine wählen.'; return; }
    if (v === null || b === null || b < v) { $('#amsg', el).textContent = 'Bitte einen gültigen Zeitraum wählen.'; return; }
    if (b - v > 120) { $('#amsg', el).textContent = 'Maximal 120 Tage auf einmal.'; return; }
    const art = $('#aart', el).value, hh = pos($('#ah', el).value, 0), bem = $('#abem', el).value.trim();
    let count = 0;
    const ok = await write(async () => {
      for (let n = v; n <= b; n++) {
        if (!isWorkday(n)) continue;
        const ds = D.str(n); const tage = {};
        for (const mid of ms) { const c = kapa(mid, n); const a = art === 'voll' ? c.grund : art === 'schicht' ? c.grund / 2 : art === 'h' ? hh : 0; tage[mid] = { ausfall: Math.min(c.grund, a), bemerkung: bem || c.bem || '' }; }
        if (S.kap.has(ds)) await Store.update('kapazitaet', ds, { tage }); else { await Store.set('kapazitaet', ds, { tage }); S.kap.set(ds, { tage }); }
        count++;
      }
    });
    if (ok) { ov.close(true); toast('Eingetragen: ' + count + ' Arbeitstage × ' + ms.length + ' Maschine(n)'); }
  };
}

/* Artikel ansehen / bearbeiten / neu */
function openArticle(nr) {
  const isNew = !nr; const a = isNew ? { nr: '', kr: '', f34: '', halb: '', f14: '', kat: 'Fertigteil', bez: '', grp: 'Rolle tangential', besch: 'Keine Beschichtung', bes: '', nut: 'prüfen', stg: '', cap: '', lz: null, rz: null, pkt: 0 } : article(nr);
  if (!a) return;
  const F = [['nr', 'Artikelnummer'], ['bez', 'Bezeichnung'], ['grp', 'Artikelgruppe'], ['kat', 'Kategorie'], ['kr', 'Kopierrolle'], ['halb', 'Halbfabrikat'], ['f34', '3/4-Fabrikat'], ['f14', '1/4-Fabrikat'], ['besch', 'Beschichtung'], ['bes', 'Besonderheiten'], ['nut', 'Nut vorhanden (ja/nein/prüfen)'], ['stg', 'Gewindesteigung'], ['lz', 'Laufzeit je Paar/Satz (h)'], ['rz', 'Rüstzeit (h)'], ['pkt', 'Lieferzeit-Punkte']];
  const caps = String(a.cap || '').split('|');
  const ov = openOverlay('modal', '<div class="dh"><h3>' + (isNew ? 'Neuer Artikel' : 'Artikel ' + esc(a.nr)) + '</h3>' + (a.quelle && a.quelle !== 'Excel' ? pill(a.quelle, 'acc') : '') + '<button class="btn ghost" type="button" data-close aria-label="Schließen">✕</button></div><div class="db"><div class="fg">' +
    F.map(([k, l]) => '<label class="f' + (k === 'bez' ? ' span2' : '') + '">' + l + (k === 'grp' ? '<select id="af-grp">' + opts(['Rolle tangential', 'Rolle axial', 'Rolle radial', 'Strehler'], ['Rolle tangential', 'Rolle axial', 'Rolle radial', 'Strehler'].find(g => norm(g) === norm(a.grp)) || a.grp) + '</select>' : '<input type="' + (['lz', 'rz', 'pkt'].includes(k) ? 'number" step="0.01' : 'text') + '" id="af-' + k + '" value="' + esc(a[k] ?? '') + '"' + (k === 'nr' && !isNew ? ' disabled' : '') + '>') + '</label>').join('') +
    '</div><div class="sect">Maschinen-Eignung</div><div class="row">' + S.capOrder.map((mid, i) => '<label class="f" style="width:120px">' + esc(machine(mid)?.name || mid) + '<select id="ac-' + i + '">' + [['', 'unbekannt'], ['j', 'ja'], ['n', 'nein']].map(([v, t]) => '<option value="' + v + '"' + ((caps[i] === v || (v === 'j' && caps[i] && caps[i] !== 'n' && caps[i] !== 'j')) ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></label>').join('') + '</div>' +
    (!isNew ? '<p class="hint">Lieferzeit-Faustregel: ' + wochenAusPunkten(a.pkt) + ' Wochen. Änderungen werden als Abweichung zum Excel-Stamm gespeichert.</p>' : '') + '</div><div class="df"><button class="btn primary" type="button" id="aok">Speichern</button><button class="btn" type="button" data-close>Abbrechen</button></div>');
  const el = ov.el;
  $('#aok', el).onclick = async () => {
    const d = {}; F.forEach(([k]) => { const i = $('#af-' + k, el); d[k] = ['lz', 'rz', 'pkt'].includes(k) ? (i.value === '' ? null : pos(i.value, 0)) : i.value.trim(); });
    if (!d.nr) { toast('Artikelnummer fehlt.'); return; }
    d.cap = S.capOrder.map((_, i) => { const v = $('#ac-' + i, el).value; const old = caps[i]; return v === 'j' && old && old !== 'n' && old !== 'j' ? old : v; }).join('|');
    if (isNew && (S.masterIdx.has(d.nr) || S.overrides.has(d.nr))) { toast('Diese Artikelnummer gibt es schon.'); return; }
    delete d.quelle; stamp(d);
    if (await write(() => Store.set('artikel', d.nr, d), 'Artikel gespeichert: ' + d.nr)) ov.close(true);
  };
}

/* ===================== Start ===================== */
async function loadStatic() {
  const [m, g] = await Promise.all([fetch('data/stammdaten.json').then(r => r.json()), fetch('data/geliefert.json').then(r => r.json())]);
  S.master = m.rows; S.capOrder = m.capOrder; S.masterIdx = new Map(m.rows.map((r, i) => [r[0], i]));
  S.gelStatic = g.rows.map(r => { const o = {}; g.cols.forEach((c, i) => o[c] = r[i]); return o; });
}
function subscribeAll() {
  const done = c => { S.loaded[c] = true; scheduleRender(); };
  Store.subscribe('auftraege', docs => { S.orders = new Map(Object.entries(docs)); done('auftraege'); });
  Store.subscribe('plan', docs => { S.planDocs = new Map(Object.entries(docs)); rebuildPlan(); done('plan'); });
  Store.subscribe('kapazitaet', docs => { S.kap = new Map(Object.entries(docs)); done('kapazitaet'); });
  Store.subscribe('geliefert', docs => { S.gelDb = new Map(Object.entries(docs)); done('geliefert'); });
  Store.subscribe('bestand', docs => { S.bestand = new Map(Object.entries(docs)); done('bestand'); });
  Store.subscribe('artikel', docs => { S.overrides = new Map(Object.entries(docs)); done('artikel'); });
  Store.subscribe('einstellungen', docs => { S.cfgExists = !!docs.config; S.cfg = mergeCfg(docs.config); holCache.clear(); done('einstellungen'); });
}
async function boot() {
  renderNav();
  const staticP = loadStatic().catch(e => { console.error(e); $('#banner').innerHTML = '<div class="banner">Stammdaten konnten nicht geladen werden. Bitte Seite neu laden.</div>'; });
  let db = null;
  if (window.claude && window.claude.use) {
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    try { S.user = await window.claude.use('user'); if (S.user) { S.uid = await S.user.id(); const me = await S.user.me(); if (me && me.name) $('#footUser').textContent = 'Angemeldet: ' + me.name; } } catch (e) { }
  }
  if (db) { S.db = db; S.mode = 'db'; Store = Remote; setConn('warn', 'Lade Daten …'); try { if (S.user && S.user.can) { const w = await S.user.can('data.write'); if (w === false) { S.canWrite = false; $('#banner').innerHTML = '<div class="banner">Sie haben Leserechte. Änderungen sind nur mit Bearbeitungsrecht möglich.</div>'; } } } catch (e) { } }
  else if (window.claude) { S.mode = 'none'; setConn('bad', 'Datenbank nicht verfügbar'); $('#banner').innerHTML = '<div class="banner">Die gemeinsame Datenbank ist in dieser Ansicht nicht verfügbar (z. B. nicht angemeldet). Bitte anmelden und neu laden.</div>'; return; }
  else { S.mode = 'local'; Store = Local; await Local.init(); setConn('ok', 'Lokaler Testmodus'); $('#banner').innerHTML = '<div class="banner"><b>Lokaler Testmodus:</b> Daten werden nur in diesem Browser gespeichert.</div>'; }
  await staticP;
  subscribeAll();
  route();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => { const b = e.target.closest('[data-action="new-order"]'); if (b) openOrder(null); });
(() => { let t; const g = $('#gsearch'); g.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { Object.assign(S.ui.orders, { q: g.value, stand: '', eing: '', perf: '', bereich: 'alle', page: 0 }); if (S.view !== 'auftraege') location.hash = 'auftraege'; else renderView(true); }, 250); }); })();
boot();

</script>
