name: Claude Code Issue Agent

on:
  issues:
    types: [opened, labeled]

jobs:
  run-claude:
    if: github.event.label.name == 'claude' || contains(github.event.issue.labels.*.name, 'claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude Code CLI installieren
        run: npm install -g @anthropic-ai/claude-code

      - name: Git konfigurieren
        run: |
          git config user.name "Claude-Bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Branch erstellen & Claude Code ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="claude/issue-${ISSUE_NUMBER}"
          git checkout -b $BRANCH_NAME

          # Projektabhängigkeiten installieren (falls vorhanden)
          if [ -f package.json ]; then
            npm install --no-audit
          fi

          PROMPT="Bearbeite folgende Aufgabe aus GitHub Issue #${ISSUE_NUMBER}:
          Titel: ${ISSUE_TITLE}
          Beschreibung: ${ISSUE_BODY}
          
          Nimm alle notwendigen Code-Änderungen im Repository vor."

          echo "=== Starte Bearbeitung durch Claude ==="
          claude --dangerously-skip-permissions -p "$PROMPT"

          # Fallback: Falls npm test existiert, führen wir es aus
          if [ -f package.json ] && grep -q '"test":' package.json; then
            echo "=== Führe npm test aus ==="
            npm test || true
          fi

          # Änderungen committen und pushen
          git add .
          git commit -m "fix: Automatische Behebung von Issue #${ISSUE_NUMBER} durch Claude" || exit 0
          git push origin $BRANCH_NAME

          # Pull Request erstellen
          gh pr create \
            --title "Fix für Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body "Dieser PR wurde automatisch von Claude Code zur Behebung von Issue #${ISSUE_NUMBER} erstellt." \
            --head $BRANCH_NAME \
            --base main
